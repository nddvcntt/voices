services:
  ingress:
    image: alpine:3.20
    container_name: thevoice_ingress
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/frpc", "-c", "/etc/frp/frpc.toml"]
    volumes:
      - /home/qldv/frp_0.59.0_linux_amd64/frpc:/usr/local/bin/frpc:ro
      - /home/qldv/voices/frpc.toml:/etc/frp/frpc.toml:ro
    network_mode: host
    depends_on:
      - thevoice
